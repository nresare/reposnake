[package]
name = "reposnake"
version = "0.2.1"
edition = "2024"
license = "MIT"

[features]
default = ["s3", "surrealdb"]
s3 = ["dep:aws-config", "dep:aws-sdk-s3"]
surrealdb = ["dep:surrealdb"]

[dependencies]
anyhow = "1.0"
async-trait = "0.1"
authzoo = "0.1.4"
aws-config = { version = "1.12", optional = true }
aws-sdk-s3 = { version = "1.149", optional = true }
axum = { version = "0.8", features = ["multipart"] }
base64 = "0.23"
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4.6", features = ["derive"] }
hex = "0.4"
handlebars = "6.4"
flate2 = "1.1"
filetime = "0.2"
jsonwebtoken = { version = "11.1", features = ["aws_lc_rs"] }
mime_guess = "2.0"
reqwest = { version = "0.13", default-features = false, features = ["blocking", "json", "rustls"] }
rust-embed = "8.12"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.11"
socket2 = "0.6"
surrealdb = { version = "3.2", default-features = false, features = ["protocol-ws"], optional = true }
tar = "0.4"
thiserror = "2.0"
tokio = { version = "1.53", features = ["fs", "io-util", "macros", "net", "rt-multi-thread", "sync"] }
toml = "1.1"
tower-http = { version = "0.7", features = ["trace"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
zip = { version = "8.6", default-features = false, features = ["deflate"] }

[dev-dependencies]
tempfile = "3.27"
tower = { version = "0.5", features = ["util"] }
surrealdb = { version = "3.2", default-features = false, features = ["kv-mem"] }
