apiVersion: v1
kind: ConfigMap
metadata:
  name: reposnake
data:
  config: |
    bind-address = "0.0.0.0:8080"
    max-upload-bytes = 104857600

    [object-store]
    directory = "/data"

    [persistence]
    uri = "mem://"

    [[identity-provider]]
    name = "kubernetes"
    audience = "reposnake"
    issuer = "https://issuer.example"

    # Optional. If omitted, reposnake fetches
    # <issuer>/.well-known/openid-configuration and uses the returned jwks_uri.
    validation-key = """
    -----BEGIN PUBLIC KEY-----
    ...
    -----END PUBLIC KEY-----
    """

    [[publisher]]
    name = "ci"
    projects = ["example-package"]

    [publisher.required-claims]
    sub = "system:serviceaccount:build:publisher"
    repository = "example-package"
